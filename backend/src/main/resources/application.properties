spring.application.name=projectlens-backend
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/projectlens_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# Comma-separated list of allowed frontend origins for CORS, e.g. https://your-app.vercel.app
projectlens.security.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true


management.endpoints.web.exposure.include=health,info
#
projectlens.security.jwt-secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value-please}
projectlens.security.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
projectlens.evaluation.threshold=${EVALUATION_THRESHOLD:70}
projectlens.evaluation.overlap-threshold=${OVERLAP_THRESHOLD:0.55}

# AI evaluation adapter. Keep disabled until the trainer provides the real API contract/prompt.
projectlens.ai.enabled=false
projectlens.ai.url=${AI_API_URL:}
projectlens.ai.api-key=${AI_API_KEY:}
projectlens.ai.model=${AI_MODEL:}
